
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans,'Pretendard',sans-serif);background:var(--color-background-primary)}
#app{max-width:100%;margin:0 auto}
.screen{display:none}.screen.active{display:block}
.hero{text-align:center;padding:2.5rem 1.5rem 1.5rem}
.hero-badge{display:inline-block;background:#E1F5EE;color:#085041;font-size:12px;font-weight:600;padding:5px 18px;border-radius:20px;margin-bottom:1.2rem;letter-spacing:.5px}
.hero h1{font-size:27px;font-weight:600;color:var(--color-text-primary);line-height:1.4;margin-bottom:.8rem}
.hero p{font-size:15px;color:var(--color-text-secondary);line-height:1.75;margin-bottom:1.8rem}
.start-btn{background:#1D9E75;color:#fff;border:none;border-radius:14px;padding:15px 44px;font-size:16px;font-weight:600;cursor:pointer}
.start-btn:hover{background:#0F6E56}
.flags-row{display:flex;justify-content:center;gap:1.8rem;padding:1.2rem 0 1rem}
.fi{text-align:center}.fi .fe{font-size:28px;display:block}.fi .fn{font-size:11px;color:var(--color-text-secondary);margin-top:3px;display:block}
.prog-wrap{padding:.9rem 1.25rem .4rem}
.prog-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--color-text-secondary);margin-bottom:7px}
.prog-bar{height:4px;background:var(--color-background-secondary);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:#1D9E75;border-radius:2px;transition:width .5s ease}
/* scene: real photo */
.scene-wrap{position:relative;margin:0 1.25rem .75rem;border-radius:18px;overflow:hidden;height:260px;background:#111}
.scene-img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .4s}
.scene-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.05) 30%,rgba(0,0,0,.72) 100%)}
.scene-tag{position:absolute;top:14px;left:14px;background:rgba(0,0,0,.48);color:#fff;font-size:12px;font-weight:500;padding:4px 13px;border-radius:20px;backdrop-filter:blur(6px)}
.scene-q{position:absolute;bottom:0;left:0;right:0;padding:1.1rem 1.25rem .9rem}
.scene-q p{color:#fff;font-size:15px;font-weight:600;line-height:1.5;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.story-box{margin:0 1.25rem .85rem;padding:1rem 1.15rem;background:var(--color-background-secondary);border-radius:12px;border-left:3px solid #1D9E75}
.story-box p{font-size:14px;color:var(--color-text-primary);line-height:1.82;font-style:italic}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 1.25rem .9rem}
.choice{border:1.5px solid var(--color-border-tertiary);border-radius:14px;cursor:pointer;overflow:hidden;background:var(--color-background-primary);transition:border-color .2s,transform .15s}
.choice:hover{border-color:#1D9E75;transform:translateY(-2px)}
.choice.selected{border:2.5px solid #1D9E75}
.cimg{width:100%;height:148px;overflow:hidden;background:#1a1a1a;position:relative}
.cimg img{width:100%;height:100%;object-fit:cover;display:block}
.cbody{padding:10px 11px 13px}
.ctag{font-size:11px;color:#1D9E75;font-weight:600;margin-bottom:3px}
.clabel{font-size:13px;font-weight:600;color:var(--color-text-primary);margin-bottom:4px;line-height:1.35}
.csub{font-size:11.5px;color:var(--color-text-secondary);line-height:1.5}
.nav-row{display:flex;justify-content:center;gap:10px;padding:0 1.25rem 1rem}
.nbtn{border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);border-radius:10px;padding:10px 22px;font-size:14px;cursor:pointer;color:var(--color-text-primary)}
.nbtn:hover{background:var(--color-background-secondary)}
.nbtn.p{background:#1D9E75;color:#fff;border-color:#1D9E75}.nbtn.p:hover{background:#0F6E56}
.nbtn:disabled{opacity:.3;cursor:not-allowed}
/* result */
.result-lm{width:100%;height:320px;position:relative;margin:0;overflow:hidden}
.result-lm img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(.55)}
.result-lm-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.1) 0%,rgba(0,0,0,.75) 100%)}
.result-lm-content{position:absolute;bottom:0;left:0;right:0;padding:1.75rem 1.5rem}
.result-lm-sub{font-size:11px;font-weight:700;letter-spacing:3px;margin-bottom:.5rem;text-transform:uppercase}
.result-lm-city{font-size:34px;font-weight:700;color:#fff;line-height:1.1;margin-bottom:.4rem;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.result-lm-local{display:flex;gap:8px;flex-wrap:wrap;margin-top:.75rem}
.lw-pill{padding:5px 14px;border-radius:20px;font-size:13px;font-weight:600;border:1px solid}
.lw-meaning{font-size:10px;display:block;opacity:.7;font-weight:400;margin-top:1px}
.stamp{position:absolute;top:20px;right:20px;width:80px;height:80px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2.5px dashed rgba(255,255,255,.5);background:rgba(0,0,0,.3);transform:rotate(-12deg)}
.stamp-flag{font-size:28px;line-height:1}
.stamp-text{font-size:8px;font-weight:700;color:rgba(255,255,255,.8);letter-spacing:1.5px;margin-top:3px}
.rcard{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:0 0 16px 16px;padding:1.25rem;margin:0 0 .85rem}
.rbadge{display:inline-block;font-size:11px;font-weight:700;padding:4px 14px;border-radius:20px;margin-bottom:.8rem;letter-spacing:.5px}
.rtype{font-size:20px;font-weight:700;color:var(--color-text-primary);margin-bottom:.3rem}
.rsub{font-size:13px;color:var(--color-text-secondary);margin-bottom:.9rem;line-height:1.5}
.rdesc{font-size:14px;color:var(--color-text-primary);line-height:1.82;margin-bottom:1rem}
.rfood{background:var(--color-background-secondary);border-radius:10px;padding:.85rem 1rem;margin-bottom:.9rem}
.rfood-l{font-size:11px;color:var(--color-text-secondary);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.rfood-v{font-size:14px;font-weight:600;color:var(--color-text-primary)}
.rtags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:1rem}
.rtag{background:var(--color-background-secondary);color:var(--color-text-secondary);font-size:12px;padding:4px 12px;border-radius:20px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.si-name{font-size:12px;color:var(--color-text-secondary);margin-bottom:5px}
.si-bg{height:5px;background:var(--color-background-secondary);border-radius:3px;overflow:hidden}
.si-fill{height:100%;border-radius:3px}
.retry{width:calc(100% - 0px);margin:.5rem 0 2rem;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);border-radius:10px;padding:12px;font-size:14px;cursor:pointer;color:var(--color-text-primary)}
.retry:hover{background:var(--color-background-secondary)}

@media(max-width:480px){
  #app{max-width:100%}
  .hero h1{font-size:22px}
  .hero p{font-size:14px}
  .scene-wrap{height:200px;margin:0 .75rem .75rem}
  .scene-q p{font-size:13px}
  .choices{gap:8px;padding:0 .75rem .75rem}
  .cimg{height:110px}
  .clabel{font-size:12px}
  .csub{font-size:11px}
  .story-box{margin:0 .75rem .75rem}
  .prog-wrap{padding:.75rem .75rem .4rem}
  .nav-row{padding:0 .75rem .75rem}
  .result-lm-city{font-size:26px}
  .rcard{padding:1rem}
  .rdesc{font-size:13px}
}
@media(min-width:481px) and (max-width:1024px){
  #app{max-width:100%;margin:0 auto}
  #screen-intro.active{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
  .hero{padding:3rem 2rem 2rem;width:100%;text-align:center}
  .hero h1{font-size:42px;margin-bottom:1.2rem}
  .hero p{font-size:18px;margin-bottom:2.5rem}
  .hero-badge{font-size:15px;padding:8px 24px;margin-bottom:1.8rem}
  .start-btn{font-size:20px;padding:20px 60px;border-radius:18px}
  .flags-row{gap:3rem;padding:2rem 0 1.5rem}
  .fi .fe{font-size:42px}
  .fi .fn{font-size:14px;margin-top:6px}
  .scene-wrap{height:340px;margin:0 1.5rem .75rem}
  .cimg{height:200px}
  .choices{gap:12px;padding:0 1.5rem 1rem}
  .clabel{font-size:15px}
  .csub{font-size:13px}
  .ctag{font-size:13px}
  .story-box{margin:0 1.5rem .85rem}
  .story-box p{font-size:16px}
  .scene-q p{font-size:17px}
  .prog-wrap{padding:1rem 1.5rem .5rem}
  .nav-row{padding:0 1.5rem 1.2rem}
  .nbtn{font-size:16px;padding:13px 28px}
  .result-lm{height:420px}
  .result-lm-city{font-size:44px}
  .rcard{padding:1.75rem}
  .rtype{font-size:24px}
  .rdesc{font-size:16px}
  .rfood-v{font-size:16px}
  .rtag{font-size:14px;padding:6px 16px}
}
@media(min-width:481px) and (max-width:1366px) and (orientation:landscape){
  #app{max-width:100%;margin:0 auto}
  #screen-intro.active{min-height:100vh}
  .hero{padding:1.5rem 3rem 1rem}
  .hero h1{font-size:36px;margin-bottom:.8rem}
  .hero p{font-size:16px;margin-bottom:1.5rem}
  .start-btn{font-size:18px;padding:16px 50px}
  .flags-row{padding:1rem 0 .5rem;gap:2.5rem}
  .fi .fe{font-size:36px}
  .scene-wrap{height:260px;margin:0 1.5rem .5rem}
  .cimg{height:150px}
  .choices{gap:10px;padding:0 1.5rem .75rem}
  .result-lm{height:340px}
  .result-lm-city{font-size:38px}
  .rcard{padding:1.2rem 1.5rem}
  .rdesc{font-size:15px}
}
@media(min-width:1025px){
  #app{max-width:720px;margin:0 auto}
  .scene-wrap{height:340px}
  .cimg{height:180px}
  .hero h1{font-size:32px}
  .result-lm{height:420px}
}
</style>

<div id="app">

<!-- INTRO -->
<div class="screen active" id="screen-intro">
  <div class="hero">
    <div class="hero-badge">🌏 울산 × 글로컬 문화 박람회</div>
    <h1>나의 글로컬<br>소울시티를 찾아서</h1>
    <p>오늘 당신은 여행을 떠납니다.<br>매 장면마다 당신의 선택이 다음 이야기를 바꿉니다.<br>끝에서 당신만의 소울시티가 밝혀집니다.</p>
    <button class="start-btn" onclick="startTest()">여행 시작하기 →</button>
  </div>
  <div class="flags-row">
    <div class="fi"><span class="fe">🇰🇷</span><span class="fn">울산</span></div>
    <div class="fi"><span class="fe">🇻🇳</span><span class="fn">베트남</span></div>
    <div class="fi"><span class="fe">🇹🇭</span><span class="fn">태국</span></div>
    <div class="fi"><span class="fe">🇨🇳</span><span class="fn">중국</span></div>
    <div class="fi"><span class="fe">🇯🇵</span><span class="fn">일본</span></div>
  </div>
  <div style="text-align:center;font-size:13px;color:var(--color-text-secondary);padding-bottom:1.8rem">선택에 따라 이야기가 달라집니다 · 약 3분</div>
</div>

<!-- QUIZ -->
<div class="screen" id="screen-quiz">
  <div class="prog-wrap">
    <div class="prog-meta"><span id="qcount">장면 1</span><span id="qcat"></span></div>
    <div class="prog-bar"><div class="prog-fill" id="pfill" style="width:14%"></div></div>
  </div>
  <div class="scene-wrap">
    <img class="scene-img" id="scene-img" src="" alt="">
    <div class="scene-overlay"></div>
    <div class="scene-tag" id="scene-tag"></div>
    <div class="scene-q"><p id="scene-q-text"></p></div>
  </div>
  <div class="story-box"><p id="story-p"></p></div>
  <div class="choices" id="choices"></div>
  <div class="nav-row">
    <button class="nbtn" id="bprev" onclick="prevQ()">← 이전</button>
    <button class="nbtn p" id="bnext" onclick="nextQ()" disabled>다음 장면 →</button>
  </div>
</div>

<!-- RESULT -->
<div class="screen" id="screen-result">
  <div class="result-lm" id="rlm"></div>
  <div class="rcard" id="rbody"></div>
  <div style="padding:0 1.25rem">
    <button class="retry" onclick="retryTest()">↺ 다시 여행하기</button>
  </div>
</div>

</div>

let path=[], scores={vn:0,th:0,cn:0,jp:0};

function startTest(){path=[];scores={vn:0,th:0,cn:0,jp:0};show('quiz');renderNode(0);}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('screen-'+id).classList.add('active');}

function renderNode(id){
  const node=TREE.find(n=>n.id===id);
  const stepNum=path.length+1;
  document.getElementById('qcount').textContent=`장면 ${stepNum}`;
  document.getElementById('qcat').textContent=node.tag;
  document.getElementById('pfill').style.width=(stepNum/8*100)+'%';
  const si=document.getElementById('scene-img');
  si.style.opacity='0';
  si.src=node.scene;
  si.onload=()=>{si.style.opacity='1';};
  si.alt=node.tag;
  document.getElementById('scene-tag').textContent=node.tag;
  document.getElementById('scene-q-text').textContent=node.sceneQ;
  document.getElementById('story-p').textContent=node.story;
  const ch=document.getElementById('choices');
  ch.innerHTML='';
  const prevEntry=path.find(e=>e.nodeId===id);
  node.choices.forEach((c,i)=>{
    const d=document.createElement('div');
    d.className='choice'+(prevEntry&&prevEntry.chosen===i?' selected':'');
    d.innerHTML=`<div class="cimg"><img src="${c.img}" alt="${c.label}" loading="lazy" onerror="this.style.opacity='.3'"></div>
    <div class="cbody"><div class="ctag">${c.tag}</div><div class="clabel">${c.label}</div><div class="csub">${c.sub}</div></div>`;
    d.onclick=()=>pick(node,i);
    ch.appendChild(d);
  });
  document.getElementById('bprev').disabled=path.length===0;
  document.getElementById('bnext').disabled=!prevEntry;
  document.getElementById('bnext').textContent=node.choices[0].next===-1?'결과 보기 ✨':'다음 장면 →';
}

function pick(node,i){
  document.querySelectorAll('.choice').forEach((b,idx)=>b.classList.toggle('selected',idx===i));
  const idx=path.findIndex(e=>e.nodeId===node.id);
  if(idx>=0)path.splice(idx);
  path.push({nodeId:node.id,chosen:i});
  document.getElementById('bnext').disabled=false;
}

function nextQ(){
  const last=path[path.length-1]; if(!last)return;
  const node=TREE.find(n=>n.id===last.nodeId);
  const choice=node.choices[last.chosen];
  Object.entries(choice.score).forEach(([k,v])=>{scores[k]=(scores[k]||0)+v;});
  if(choice.next===-1){showResult();return;}
  renderNode(choice.next);
}

function prevQ(){
  if(path.length===0)return;
  const last=path[path.length-1];
  Object.entries(TREE.find(n=>n.id===last.nodeId).choices[last.chosen].score).forEach(([k,v])=>scores[k]-=v);
  path.pop();
  if(path.length===0)renderNode(0);
  else{const p=path[path.length-1];renderNode(TREE.find(n=>n.id===p.nodeId).choices[p.chosen].next);}
}

function showResult(){
  const winner=Object.entries(scores).sort((a,b)=>b[1]-a[1])[0][0];
  const r=RESULTS[winner];
  const max=Math.max(...Object.values(scores));

  // 랜드마크 이미지 크게
  document.getElementById('rlm').innerHTML=`
    <img src="${r.lmImg}" alt="${r.city}" style="width:100%;height:100%;object-fit:cover;display:block;filter:brightness(.55)">
    <div class="result-lm-overlay"></div>
    <div class="stamp">
      <span class="stamp-flag">${r.flag}</span>
      <span class="stamp-text">${r.country}</span>
      <span class="stamp-text" style="font-size:7px;opacity:.6">SOUL CITY</span>
    </div>
    <div class="result-lm-content">
      <div class="result-lm-sub" style="color:${r.accentColor}">나의 글로컬 소울시티</div>
      <div class="result-lm-city">${r.flag} ${r.city}</div>
      <div class="result-lm-local">
        ${r.localWord.map(lw=>`
          <div class="lw-pill" style="background:${r.badgeBg};color:${r.accentColor};border-color:${r.badgeBorder}">
            <span class="lw-word">${lw.w}</span>
            <span class="lw-meaning">${lw.m}</span>
          </div>`).join('')}
      </div>
    </div>`;

  document.getElementById('rbody').innerHTML=`
    <span class="rbadge" style="background:${r.badgeBg};color:${r.accentColor};border:1px solid ${r.badgeBorder}">${r.badge}</span>
    <div class="rtype">${r.type}</div>
    <div class="rsub">${r.sub}</div>
    <div class="rdesc">${r.desc}</div>
    <div class="rfood"><div class="rfood-l">나의 글로컬 소울푸드</div><div class="rfood-v">${r.food}</div></div>
    <div class="rtags">${r.tags.map(t=>`<span class="rtag">${t}</span>`).join('')}</div>
    <div class="rfood-l" style="margin-bottom:.6rem">나의 글로컬 성향 점수</div>
    <div class="sgrid">${Object.entries(scores).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{
      const nm={vn:'🇻🇳 베트남',th:'🇹🇭 태국',cn:'🇨🇳 중국',jp:'🇯🇵 일본'};
      const col={vn:'#1D9E75',th:'#e6a800',cn:'#e84040',jp:'#7c6ff5'};
      const pct=max?Math.round(v/max*100):0;
      return `<div><div class="si-name">${nm[k]}</div><div class="si-bg"><div class="si-fill" style="width:${pct}%;background:${k===winner?col[k]:'#B4B2A9'}"></div></div></div>`;
    }).join('')}</div>`;
  show('result');
}
function retryTest(){scores={vn:0,th:0,cn:0,jp:0};path=[];show('intro');}
